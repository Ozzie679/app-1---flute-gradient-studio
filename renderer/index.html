<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'">
<title>Flute Gradient Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- The wallpaper is the whole window. For iPad/iPhone it sits in a
     device-shaped frame over a blurred copy of itself (no black bars). -->
<div class="stage" id="stage">
  <canvas id="backdrop" width="64" height="40" aria-hidden="true"></canvas>
  <div class="frame" id="frame">
    <canvas id="main"></canvas>
    <div class="lockscreen" id="lockscreen" aria-hidden="true">
      <div class="island"></div>
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
  </div>
</div>

<div class="drag-strip" aria-hidden="true"></div>

<!-- ---- top bar ---- -->
<div class="glass topbar chrome">
  <span class="app-title">Flute Gradient Studio <span class="beta-badge" id="versionBadge">Beta</span></span>
  <div class="seg" id="deviceSeg" role="group" aria-label="Device">
    <button data-device="desktop" class="active">Mac</button>
    <button data-device="ipad">iPad</button>
    <button data-device="iphone">iPhone</button>
  </div>
  <button class="icon-btn" id="fullscreenBtn" aria-label="Full-screen view" title="Full-screen view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
</div>

<div class="glass update-banner chrome" id="updateBanner" role="status" hidden>
  <span id="updateText"></span>
  <button id="updateBtn"></button>
</div>

<!-- ---- controls panel ---- -->
<aside class="glass panel chrome">
  <section class="section">
    <h2 class="section-title">Presets</h2>
    <div class="swatch-row looks" id="presetRow"></div>
    <div class="subhead-row">
      <span class="subhead">My presets</span>
      <button class="mini-btn text" id="savePreset" title="Save the current look">+ Save</button>
    </div>
    <div class="swatch-row looks" id="myPresetRow"></div>
    <p class="empty-hint" id="myPresetEmpty">Save a look you like to get it back later.</p>
  </section>

  <section class="section">
    <h2 class="section-title">Colour</h2>
    <span class="subhead">Palettes</span>
    <div class="swatch-row" id="paletteRow"></div>
    <div class="colors-row" id="colorsRow">
      <!-- colour pickers are built by app.js (3-6 of them) -->
      <button class="color-count" id="removeColor" aria-label="Remove a colour" title="Remove a colour">−</button>
      <button class="color-count" id="addColor" aria-label="Add a colour" title="Add a colour">+</button>
    </div>
    <div class="slider-row" ><label for="shape">Shape</label>
      <span class="val-group"><span class="val mono" id="shapeVal"></span><button class="mini-btn" id="newShape" aria-label="New shape" title="New shape">⚄</button></span>
    </div>
    <input type="range" id="shape" min="0" max="100" step="1">
    <label class="slider-row" for="waveX"><span>Flow ↔</span><span class="val mono" id="waveXVal"></span></label>
    <input type="range" id="waveX" min="0" max="1" step="0.01">
    <label class="slider-row" for="waveY"><span>Flow ↕</span><span class="val mono" id="waveYVal"></span></label>
    <input type="range" id="waveY" min="0" max="1" step="0.01">
    <label class="slider-row" for="softness"><span>Blend</span><span class="val mono" id="softnessVal"></span></label>
    <input type="range" id="softness" min="0" max="1" step="0.01">
    <label class="slider-row" for="haze"><span>Softness</span><span class="val mono" id="hazeVal"></span></label>
    <input type="range" id="haze" min="0" max="1" step="0.01">
    <label class="slider-row" for="angle"><span>Rotation</span><span class="val mono" id="angleVal"></span></label>
    <input type="range" id="angle" min="0" max="360" step="1">
  </section>

  <section class="section">
    <div class="section-title-row">
      <h2 class="section-title">Glow</h2>
      <input type="checkbox" class="switch" id="glowEnabled" aria-label="Glow highlight" checked>
    </div>
    <div id="glowControls">
      <div class="glow-row">
        <label class="chip-wrap"><input type="color" id="glowColor" aria-label="Glow colour"><span>Colour</span></label>
        <div class="glow-pos" id="glowPos" role="radiogroup" aria-label="Glow position">
          <button data-pos="tl" aria-label="Top left"></button><span></span><button data-pos="tr" aria-label="Top right"></button>
          <span></span><button data-pos="c" aria-label="Centre"></button><span></span>
          <button data-pos="bl" aria-label="Bottom left"></button><span></span><button data-pos="br" aria-label="Bottom right"></button>
        </div>
      </div>
      <label class="slider-row" for="glowOpacity"><span>Strength</span><span class="val mono" id="glowOpacityVal"></span></label>
      <input type="range" id="glowOpacity" min="5" max="70" step="1">
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Glass</h2>
    <label class="select-row" for="glassShape"><span>Flute shape</span>
      <select id="glassShape">
        <option value="1">Prism</option>
        <option value="2">Lens</option>
        <option value="3">Contour</option>
        <option value="4">Cascade</option>
        <option value="5">Flat</option>
      </select>
    </label>
    <label class="slider-row" for="fluteSize"><span>Flute size</span><span class="val mono" id="fluteSizeVal"></span></label>
    <input type="range" id="fluteSize" min="0" max="1" step="0.01">
    <label class="slider-row" for="fluteBlur"><span>Flute blur</span><span class="val mono" id="fluteBlurVal"></span></label>
    <input type="range" id="fluteBlur" min="0" max="0.6" step="0.01">
    <label class="slider-row" for="distortion"><span>Distortion</span><span class="val mono" id="distortionVal"></span></label>
    <input type="range" id="distortion" min="0" max="1" step="0.01">
    <label class="slider-row" for="vShift"><span>Refraction ↕</span><span class="val mono" id="vShiftVal"></span></label>
    <input type="range" id="vShift" min="-1" max="1" step="0.01">
    <label class="slider-row" for="shadows"><span>Shadow depth</span><span class="val mono" id="shadowsVal"></span></label>
    <input type="range" id="shadows" min="0" max="1" step="0.01">
    <label class="slider-row" for="highlights"><span>Highlight strength</span><span class="val mono" id="highlightsVal"></span></label>
    <input type="range" id="highlights" min="0" max="0.35" step="0.01">
  </section>
</aside>

<!-- ---- bottom bars ---- -->
<div class="bottom-row chrome">
  <div class="glass tray">
    <span class="tray-label">Variations</span>
    <div class="gallery" id="gallery"></div>
    <button class="icon-btn tray-refresh" id="refreshGallery" aria-label="New variations" title="New variations">↻</button>
  </div>
  <div class="glass actions">
    <span class="meta"><span id="paletteName">Custom</span> · <span class="mono" id="resLabel"></span></span>
    <button class="btn" id="shuffleBtn">Shuffle</button>
    <button class="btn primary" id="downloadBtn">Save PNG</button>
  </div>
</div>

<div class="glass toast" id="loadingNote" role="status"></div>

<!-- ---- full-screen view controls (shown on mouse move) ---- -->
<div class="glass immersive-bar" id="immersiveBar">
  <button class="icon-btn" id="prevVariation" aria-label="Previous variation" title="Previous variation">‹</button>
  <button class="btn" id="immersiveShuffle">Shuffle</button>
  <button class="icon-btn" id="nextVariation" aria-label="Next variation" title="Next variation">›</button>
  <span class="divider"></span>
  <label class="toggle-row device-only"><input type="checkbox" class="switch" id="lockToggle" checked> Lock screen</label>
  <label class="toggle-row device-only"><input type="checkbox" class="switch" id="ambientToggle" checked> Backdrop</label>
  <span class="divider device-only"></span>
  <button class="btn primary" id="immersiveSave">Save PNG</button>
  <button class="btn ghost" id="exitFullscreen">Exit · Esc</button>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
